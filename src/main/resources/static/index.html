<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">Employee Management System</h2>

    <!-- Form Section -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="card-title mb-0" id="formTitle">Add New Employee</h5>
        </div>
        <div class="card-body">
            <form id="employeeForm">
                <input type="hidden" id="empId">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" id="firstName" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lastName" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" id="department" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Salary</label>
                        <input type="number" step="0.01" class="form-control" id="salary" required>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success" id="saveBtn">Save Employee</button>
                    <button type="button" class="btn btn-secondary d-none" id="cancelBtn" onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Table Section -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="card-title mb-0">Employee List</h5>
        </div>
        <div class="card-body">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8089/api/employees";

    document.addEventListener("DOMContentLoaded", fetchEmployees);

    // Fetch and display employees
    function fetchEmployees() {
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("employeeTableBody");
                tbody.innerHTML = "";
                data.forEach(emp => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${emp.id}</td>
                            <td>${emp.name || emp.firstName + ' ' + emp.lastName}</td>
                            <td>${emp.email}</td>
                            <td>${emp.department}</td>
                            <td>$${emp.salary}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-warning me-2" onclick="editEmployee(${emp.id}, '${emp.name || ''}', '${emp.firstName}', '${emp.lastName}', '${emp.email}', '${emp.department}', ${emp.salary})">Edit</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteEmployee(${emp.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            });
    }

    // Save or Update Employee
    document.getElementById("employeeForm").addEventListener("submit", function(e) {
        e.preventDefault();
        const id = document.getElementById("empId").value;
        const payload = {
            name: document.getElementById("name").value,
            firstName: document.getElementById("firstName").value,
            lastName: document.getElementById("lastName").value,
            email: document.getElementById("email").value,
            department: document.getElementById("department").value,
            salary: parseFloat(document.getElementById("salary").value)
        };

        const method = id ? "PUT" : "POST";
        const url = id ? `${API_URL}/${id}` : API_URL;

        fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        }).then(() => {
            resetForm();
            fetchEmployees();
        });
    });

    // Edit button clicked
    function editEmployee(id, name, firstName, lastName, email, department, salary) {
        document.getElementById("empId").value = id;
        document.getElementById("name").value = name;
        document.getElementById("firstName").value = firstName;
        document.getElementById("lastName").value = lastName;
        document.getElementById("email").value = email;
        document.getElementById("department").value = department;
        document.getElementById("salary").value = salary;

        document.getElementById("formTitle").innerText = "Edit Employee";
        document.getElementById("saveBtn").innerText = "Update Employee";
        document.getElementById("cancelBtn").classList.remove("d-none");
    }

    // Delete Employee
    function deleteEmployee(id) {
        if (confirm("Are you sure you want to delete this employee?")) {
            fetch(`${API_URL}/${id}`, { method: "DELETE" })
                .then(() => fetchEmployees());
        }
    }

    // Reset Form
    function resetForm() {
        document.getElementById("employeeForm").reset();
        document.getElementById("empId").value = "";
        document.getElementById("formTitle").innerText = "Add New Employee";
        document.getElementById("saveBtn").innerText = "Save Employee";
        document.getElementById("cancelBtn").classList.add("d-none");
    }
</script>
</body>
</html>
